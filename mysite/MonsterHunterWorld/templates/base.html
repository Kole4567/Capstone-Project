{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
    <div class="navbar bg-base-100 shadow-md px-4">
        <div class="navbar-start">
            <a href="{% url 'home' %}" class="btn btn-ghost text-lg font-bold">MHW Home</a>
        </div>

        <div class="navbar-center flex gap-1">
            <a href="{% url 'weapon_index' %}" class="btn btn-ghost btn-sm">Weapons</a>
            <a href="{% url 'armors_index' %}" class="btn btn-ghost btn-sm">Armor</a>
            <a href="{% url 'charms_index' %}" class="btn btn-ghost btn-sm">Charms</a>
            <a href="{% url 'monsters_index' %}" class="btn btn-ghost btn-sm">Monsters</a>
            <a href="{% url 'decorations_index' %}" class="btn btn-ghost btn-sm">Decorations</a>
            <a href="{% url 'builds_feed' %}" class="btn btn-ghost btn-sm">Community</a>
        </div>

        <div class="navbar-end flex gap-2">
            {% if user.is_authenticated %}
                <a href="{% url 'build_create' %}" class="btn btn-ghost btn-sm">+ Create Build</a>
                <a href="{% url 'my_builds' %}" class="btn btn-ghost btn-sm">My Builds</a>
                <a href="{% url 'inventory_home' %}" class="btn btn-ghost btn-sm">Inventory</a>
                <a href="{% url 'account_logout' %}" class="btn btn-outline btn-sm">Logout</a>
            {% else %}
                <a href="/accounts/google/login/" class="btn btn-primary btn-sm">Login with Google</a>
            {% endif %}
        </div>
    </div>

    {% block content %}{% endblock %}
</body>
</html>
