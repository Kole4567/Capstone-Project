{% extends "base.html" %}
{% block content %}
<div style="background-color:#0f172a; min-height:100vh; padding:40px 20px; color:white; font-family:sans-serif;">
    <div style="max-width:800px; margin:0 auto;">

        <h1 style="font-size:2.5rem; font-weight:900; font-style:italic; color:#10b981; text-transform:uppercase; margin-bottom:40px;">
            Create Post
        </h1>

        <form method="post" style="display:flex; flex-direction:column; gap:24px;">
            {% csrf_token %}

            <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:16px;">
                <h2 style="color:#10b981; font-size:1rem; font-weight:700; text-transform:uppercase; margin:0;">Post Details</h2>

                <div>
                    <label style="color:#94a3b8; font-size:0.75rem; text-transform:uppercase; font-weight:700; display:block; margin-bottom:6px;">Title *</label>
                    <input type="text" name="title" required placeholder="e.g. Best build for Teostra?"
                           style="width:100%; background:#0f172a; color:white; border:1px solid #334155; border-radius:8px; padding:10px 14px; font-size:0.95rem; box-sizing:border-box; font-family:inherit;">
                </div>

                <div>
                    <label style="color:#94a3b8; font-size:0.75rem; text-transform:uppercase; font-weight:700; display:block; margin-bottom:6px;">Content *</label>
                    <textarea name="content" rows="8" required placeholder="Share your thoughts, questions, or tips with the community…"
                              style="width:100%; background:#0f172a; color:white; border:1px solid #334155; border-radius:8px; padding:10px 14px; font-size:0.95rem; box-sizing:border-box; resize:vertical; font-family:inherit; line-height:1.6;"></textarea>
                </div>
            </div>

            <div style="display:flex; gap:12px;">
                <button type="submit"
                        style="flex:1; background:#10b981; color:white; border:none; border-radius:10px; padding:14px; font-weight:700; font-size:1rem; cursor:pointer; font-family:inherit;">
                    Post
                </button>
                <a href="{% url 'community_feed' %}"
                   style="background:#334155; color:white; border-radius:10px; padding:14px 24px; font-weight:700; text-decoration:none; font-size:1rem; display:flex; align-items:center;">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
