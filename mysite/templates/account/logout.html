{% extends "base.html" %}
{% block content %}
<div style="background-color:#0f172a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:16px; padding:48px; width:100%; max-width:440px; box-shadow:0 20px 40px rgba(0,0,0,0.4); text-align:center;">

        <h1 style="font-size:2rem; font-weight:900; font-style:italic; color:#ef4444; text-transform:uppercase; margin-bottom:8px;">
            Sign Out
        </h1>
        <p style="color:#64748b; font-size:0.85rem; margin-bottom:36px;">
            Are you sure you want to sign out?
        </p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit"
                style="width:100%; background:#ef4444; color:white; border:none; border-radius:10px; padding:14px; font-weight:700; font-size:0.95rem; cursor:pointer; margin-bottom:12px;">
                Yes, Sign Out
            </button>
        </form>

        <a href="/"
           style="display:block; width:100%; background:#1e293b; color:#94a3b8; border:1px solid #334155; border-radius:10px; padding:14px; font-weight:700; font-size:0.95rem; text-decoration:none; box-sizing:border-box;">
            Cancel
        </a>
    </div>
</div>
{% endblock %}
